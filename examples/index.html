<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlgiViz insertion sort demo</title>
<style>body{margin:24px;background:#101827;color:#f1f5f9;font:16px system-ui}main{max-width:960px;margin:auto}canvas{width:100%;height:auto}button,input{margin:8px 4px}input{width:60%}</style>
<main><h1>AlgiViz · Insertion sort</h1><p>Input: 5, 2, 4, 2, 1. Purple key is held outside the array. Labels show signed values.</p>
<canvas width="960" height="540" aria-label="Insertion sort visualization"></canvas>
<div><button id="play">Play</button><button id="reset">Restart</button><label>Time <input id="time" type="range" min="0" value="0" step="1"></label></div><p id="status" aria-live="polite"></p></main>
<script type="module">
import { insertionSortSteps, createSortTimeline } from '../dist/core/index.js';
import { createSortRenderer } from '../dist/canvas/index.js';
const timeline=createSortTimeline(insertionSortSteps([5,2,4,2,1]),{stepDurationMs:650,finalHoldMs:2000});
const renderer=createSortRenderer({theme:'dark'}), ctx=document.querySelector('canvas').getContext('2d');
const slider=document.querySelector('#time'), play=document.querySelector('#play'), status=document.querySelector('#status');
slider.max=timeline.durationMs;
let time=0, running=false, last=null, raf=0;
function draw(){const frame=timeline.sample(time);renderer.render(ctx,frame);slider.value=time;status.textContent=`Step ${frame.stepIndex}: ${frame.event.type}. Time ${(time/1000).toFixed(1)} s`}
function tick(now){if(!running)return;if(last!==null)time=Math.min(timeline.durationMs,time+now-last);last=now;draw();if(time===timeline.durationMs){running=false;play.textContent='Play'}else raf=requestAnimationFrame(tick)}
play.onclick=()=>{cancelAnimationFrame(raf);running=!running;play.textContent=running?'Pause':'Play';last=null;if(running){if(time===timeline.durationMs)time=0;raf=requestAnimationFrame(tick)}};
slider.oninput=()=>{cancelAnimationFrame(raf);running=false;play.textContent='Play';time=Number(slider.value);draw()};
document.querySelector('#reset').onclick=()=>{cancelAnimationFrame(raf);running=false;play.textContent='Play';time=0;draw()};
new ResizeObserver(entries=>{const width=Math.round(entries[0].contentRect.width);if(width>0){ctx.canvas.width=width;ctx.canvas.height=Math.max(280,Math.round(width*0.5625));draw()}}).observe(document.querySelector("main"));
draw();
</script></html>
